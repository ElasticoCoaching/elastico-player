<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1158B8"><meta name="apple-mobile-web-app-capable" content="yes"><title>Elastico Player 0.1.2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e8f3f4;background:#0b1b20;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4}.app{max-width:570px;min-height:100dvh;margin:auto;padding:20px 16px 105px}.brand{font-size:11px;letter-spacing:2px;color:#87cdd6;font-weight:800}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.h1{font-size:27px;font-weight:750;margin:10px 0 4px}.h2{font-size:17px;font-weight:700;margin:0 0 10px}.muted{color:#9cb7bd}.small{font-size:12px}.tiny{font-size:11px}.card{background:#17313a;border:1px solid #2c4b54;border-radius:15px;padding:15px;margin:12px 0}.card.soft{background:#102832}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.btn{border:1px solid #37929d;background:#287f8b;color:white;border-radius:9px;padding:11px 13px;font-weight:650}.btn.sub{background:#1a414b;border-color:#3a6670}.btn.ghost{background:transparent;border-color:#395a63;color:#c0e0e4}.btn.tiny{padding:7px 10px;font-size:12px}.full{width:100%}.chip{display:inline-block;border-radius:50px;padding:5px 9px;font-size:11px;background:#214650;color:#bde7eb}.ok{color:#83d9b4}.warn{color:#e7c68c}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;color:#b8d3d8}input,textarea,select{background:#0e252d;color:#effafb;border:1px solid #3c626a;border-radius:9px;padding:11px;width:100%;min-width:0}textarea{resize:vertical;min-height:74px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 10px}.tabs button{white-space:nowrap}.item{border:1px solid #33545e;background:#193842;border-radius:11px;padding:12px;margin:9px 0}.item button{flex-shrink:0}.line{border-top:1px solid #2c4b54;margin:12px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#0d222a;border-top:1px solid #31515a;padding-bottom:env(safe-area-inset-bottom);z-index:10}.navin{max-width:570px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;border:0;color:#8caab1;padding:11px 2px;font-size:11px;display:grid;gap:4px;justify-items:center}.nav button.active{color:#9ae0e8}.nav .symbol{font-size:21px}.day{display:flex;gap:8px;overflow:auto;padding:10px 0}.day button{min-width:62px;border:1px solid #34545d;border-radius:10px;padding:9px 5px;background:#15313a;color:#c5dce0}.day button.active{background:#276e7a;border-color:#65b9c5;color:white}.bubble{padding:11px 12px;border-radius:12px;background:#24464f;margin:8px 0;max-width:89%;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:#246f7b}.dot{height:7px;width:7px;background:#75c8d3;border-radius:50%;display:inline-block}.empty{padding:22px 12px;text-align:center;color:#a3bdc2;border:1px dashed #365861;border-radius:12px}.meter{height:7px;border-radius:10px;background:#31505a;overflow:hidden}.meter>div{height:100%;background:#80c9d2}.note{font-size:12px;line-height:1.55;color:#a9c5cb}.danger{color:#f3b4aa}.nowrap{white-space:nowrap}details summary{cursor:pointer;font-weight:600}details[open] summary{margin-bottom:10px}@media(min-width:700px){.app{border-left:1px solid #27434b;border-right:1px solid #27434b}}

/* Club theme: change these tokens for another club */
:root{--club-primary:#1259B5;--club-primary-dark:#08418E;--club-light:#EAF2FF;--club-white:#FFFFFF;--club-border:#CFDCF0;--club-ink:#153253;--club-muted:#60748E;--club-card:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--club-ink);background:#F2F6FC}
body{background:#F2F6FC;color:var(--club-ink)}.brand{color:var(--club-primary)}.muted,.note{color:var(--club-muted)}.card,.card.soft{background:var(--club-card);border-color:var(--club-border);box-shadow:0 2px 12px rgba(19,69,128,.04)}.item{background:#F5F9FF;border-color:var(--club-border)}.line{border-color:var(--club-border)}.btn{background:var(--club-primary);border-color:var(--club-primary-dark);color:#fff}.btn.sub{background:#E3EDFC;border-color:#BCD0EC;color:#124A91}.btn.ghost{background:#fff;border-color:#B6CAE5;color:#164A88}.chip{background:#E5EFFD;color:#164C95}.ok{color:#13724D}.warn{color:#926400}.field label{color:#35526F}input,textarea,select{background:#fff;color:#142F4D;border-color:#B7CBE5}.nav{background:#fff;border-color:var(--club-border);box-shadow:0 -3px 15px rgba(25,67,120,.06)}.nav button{color:#6C7E98}.nav button.active{color:var(--club-primary)}.day button{background:#fff;color:#315A8B;border-color:var(--club-border)}.day button.active{background:var(--club-primary);border-color:var(--club-primary-dark);color:white}.bubble{background:#E8F0FD;color:#18385D}.bubble.mine{background:#C9DEFF}.dot{background:var(--club-primary)}.empty{color:#657C96;border-color:#BCD0EC}.meter{background:#D8E6F8}.meter>div{background:var(--club-primary)}.danger{color:#B82E36}.player-identity{display:flex;align-items:center;gap:12px}.jersey{width:63px;height:69px;flex:none;filter:drop-shadow(0 3px 3px rgba(0,43,110,.16))}.jersey.large{width:76px;height:83px}.dev-tools{margin-top:12px}.dev-tools summary{color:#5E7594;font-size:12px}.dev-tools .note{margin-bottom:0}.profile-note{font-size:12px;color:#60748E;margin-top:6px}

<script>
'use strict';
const KEY='elastico-player-v01';const dayISO=(d)=>{const z=new Date(d);return `${z.getFullYear()}-${String(z.getMonth()+1).padStart(2,'0')}-${String(z.getDate()).padStart(2,'0')}`};const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return dayISO(x)};const today=dayISO(new Date());const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>('id-'+Date.now()+'-'+Math.random().toString(36).slice(2,8));
const seed=()=>({schema:'elastico-shared-v1',version:1,exportedAt:null,teams:[{id:'u19',name:'U19'},{id:'u17',name:'U17'}],players:[{id:'p1',name:'Lucas Hessel',teamId:'u19',position:'',number:9,goal:''},{id:'p2',name:'Noah Larsen',teamId:'u19',position:'Angriber',number:9,goal:'Sprint og afslutninger'},{id:'p3',name:'William Hansen',teamId:'u17',position:'Forsvar',number:4,goal:'Sprintmekanik'}],activePlayerId:'p1',programs:[{id:'prog1',name:'Sprint & acceleration',focus:'Fysisk træning',exercises:[{id:'ex1',name:'A-skips',prescription:'2 × 15 m'},{id:'ex2',name:'Acceleration',prescription:'5 × 15 m'},{id:'ex3',name:'Flying sprint',prescription:'3 × 20 m'}]},{id:'prog2',name:'Styrke & robusthed',focus:'Fysisk træning',exercises:[{id:'ex4',name:'Split squat',prescription:'3 × 8'},{id:'ex5',name:'Nordic hamstring',prescription:'2 × 5'},{id:'ex6',name:'Copenhagen plank',prescription:'3 × 20 sek'}]}],calendarEvents:[{id:'event1',date:today,teamId:'u19',type:'team',title:'Fodboldtræning',start:'17:00',end:'18:30',theme:'Opbygning',blocks:[{id:'b1',name:'Opvarmning',description:'Dynamisk opvarmning og boldaktivering'},{id:'b2',name:'Principspil',description:'Positionsspil og relationer'},{id:'b3',name:'Udtryksspil',description:'Individuelle handlinger og beslutninger'},{id:'b4',name:'Temaspil/Kamp',description:'Spil med dagens tema'}]},{id:'event2',date:today,teamId:'u19',playerId:'p1',type:'individual',title:'Sprint & acceleration',programId:'prog1'},{id:'event3',date:addDays(today,2),teamId:'u19',type:'team',title:'Fodboldtræning',start:'17:00',end:'18:30',theme:'Højt pres',blocks:[{id:'b5',name:'Opvarmning',description:'Boldaktivering'},{id:'b6',name:'Principspil',description:'Presudløsere'},{id:'b7',name:'Udtryksspil',description:'1v1 presaktioner'},{id:'b8',name:'Temaspil/Kamp',description:'Spil med højt pres'}]},{id:'event4',date:addDays(today,4),teamId:'u19',playerId:'p1',type:'individual',title:'Styrke & robusthed',programId:'prog2'}],checkins:[],taskCompletions:[],attendance:[],messages:[{id:'m1',scope:'team',teamId:'u19',senderRole:'coach',senderName:'Træner',text:'Husk at være klar 15 minutter før træningsstart.',createdAt:new Date().toISOString()},{id:'m2',scope:'private',teamId:'u19',playerId:'p1',senderRole:'coach',senderName:'Træner',text:'Fokus på kvalitet i accelerationerne i dag. Giv besked, hvis du er øm.',createdAt:new Date().toISOString()}],performance:[]});
function read(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.schema==='elastico-shared-v1'){/* Keep old data and identities separate: never assign Oliver's check-ins to Lucas. */if(!x.players.some(p=>p.name==='Lucas Hessel')){const old=x.players.find(p=>String(p.id)===String(x.activePlayerId))||x.players[0];const lucas={id:'demo-lucas-hessel',name:'Lucas Hessel',teamId:old?.teamId||x.teams[0]?.id,position:'',number:9,goal:''};x.players.push(lucas);x.activePlayerId=lucas.id;try{localStorage.setItem(KEY,JSON.stringify(x))}catch(e){}}return x}}catch(e){}return seed()}let db=read(),page='home',selectedDate=today,conversation='team',toast='',expandedEvent=null;function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Kunne ikke gemme lokalt. Browserens lager kan være fyldt eller deaktiveret.');return false}}const player=()=>db.players.find(p=>String(p.id)===String(db.activePlayerId))||db.players[0];const team=()=>db.teams.find(t=>String(t.id)===String(player()?.teamId));const eligible=e=>{const p=player();return p&&(!e.teamId||String(e.teamId)===String(p.teamId))&&(!e.playerId||String(e.playerId)===String(p.id))};const eventsOn=d=>(db.calendarEvents||[]).filter(e=>e.date===d&&eligible(e));const checkinOn=d=>(db.checkins||[]).find(x=>x.date===d&&String(x.playerId)===String(player()?.id));const completed=(eventId,taskId)=>db.taskCompletions.find(x=>String(x.playerId)===String(player()?.id)&&String(x.eventId)===String(eventId)&&String(x.taskId)===String(taskId));const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'});const dateShort=d=>new Date(d+'T12:00:00').toLocaleDateString('da-DK',{day:'numeric',month:'short'});const el=s=>document.getElementById(s);const btn=(text,fn,klass='sub')=>`<button class="btn ${klass}" onclick="${fn}">${text}</button>`;

/* Desktop test import v0.1.2: additive, idempotent, preserving all other data. */
(function(){
 const incoming=[{"id":"desktop-10556513-aeae-4db7-9b56-851e09adf4af-m5","name":"5 m sprint","date":"2026-10-27","value":"0,95 sek.","source":"Elastico Desktop","sourceRecordId":"10556513-aeae-4db7-9b56-851e09adf4af"},{"id":"desktop-10556513-aeae-4db7-9b56-851e09adf4af-m10","name":"10 m sprint","date":"2026-10-27","value":"1,7 sek.","source":"Elastico Desktop","sourceRecordId":"10556513-aeae-4db7-9b56-851e09adf4af"},{"id":"desktop-10556513-aeae-4db7-9b56-851e09adf4af-m30","name":"30 m sprint","date":"2026-10-27","value":"3,99 sek.","source":"Elastico Desktop","sourceRecordId":"10556513-aeae-4db7-9b56-851e09adf4af"},{"id":"desktop-10556513-aeae-4db7-9b56-851e09adf4af-fly20","name":"Flyvende 20 m","date":"2026-10-27","value":"2,29 sek.","source":"Elastico Desktop","sourceRecordId":"10556513-aeae-4db7-9b56-851e09adf4af"},{"id":"desktop-10556513-aeae-4db7-9b56-851e09adf4af-arrow","name":"Arrowhead","date":"2026-10-27","value":"7,67 sek.","source":"Elastico Desktop","sourceRecordId":"10556513-aeae-4db7-9b56-851e09adf4af"},{"id":"desktop-10556513-aeae-4db7-9b56-851e09adf4af-cmj","name":"CMJ","date":"2026-10-27","value":"36 cm","source":"Elastico Desktop","sourceRecordId":"10556513-aeae-4db7-9b56-851e09adf4af"},{"id":"desktop-10556513-aeae-4db7-9b56-851e09adf4af-yoyo","name":"Yo-Yo","date":"2026-10-27","value":"1500 m","source":"Elastico Desktop","sourceRecordId":"10556513-aeae-4db7-9b56-851e09adf4af"}];
 const lucas=db.players.find(p=>String(p.name||'').trim().toLowerCase()==='lucas hessel');
 if(!lucas)return;
 if(!Array.isArray(db.performance))db.performance=[];
 let record=db.performance.find(x=>String(x.playerId)===String(lucas.id));
 if(!record){record={playerId:lucas.id,tests:[],gps:[]};db.performance.push(record)}
 if(!Array.isArray(record.tests))record.tests=[];
 let changed=false;
 for(const t of incoming){
  if(!record.tests.some(x=>x.id===t.id || (x.name===t.name && x.date===t.date && x.source==='Elastico Desktop'))){record.tests.push(t);changed=true}
 }
 if(changed)save();
})();
function nav(){el('nav').innerHTML=[['home','⌂','I dag'],['calendar','▦','Kalender'],['data','▥','Mine data'],['messages','✉','Beskeder'],['settings','⚙','Mere']].map(([k,ic,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span class="symbol">${ic}</span>${t}</button>`).join('')};function go(p){page=p;expandedEvent=null;render();window.scrollTo(0,0)}function header(title,sub){return `<div class="top"><div><div class="brand">ELASTICO / PLAYER 0.1.3</div><h1 class="h1">${title}</h1><div class="muted small">${sub||''}</div></div><span class="chip">${escapeHTML(team()?.name||'Demo')}</span></div>`}

function jersey(number,large=false){const n=number===undefined||number===null||number===''?'':String(number);return `<svg class="jersey ${large?'large':''}" viewBox="0 0 110 118" role="img" aria-label="Blå spillertrøje, rygnummer ${escapeHTML(n||'ikke angivet')}"><defs><linearGradient id="jerseyBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1675D4"/><stop offset=".55" stop-color="#0F5EC3"/><stop offset="1" stop-color="#094A9E"/></linearGradient><pattern id="ribbing" width="3" height="3" patternUnits="userSpaceOnUse"><path d="M1 0V3" stroke="#fff" stroke-opacity=".055" stroke-width=".5"/></pattern></defs><path d="M29 11L42 6Q55 17 68 6L81 11L107 31L92 54L80 46L80 112L30 112L30 46L18 54L3 31Z" fill="url(#jerseyBlue)" stroke="#08488E" stroke-width="2" stroke-linejoin="round"/><path d="M30 18L80 18L80 110L30 110Z" fill="url(#ribbing)"/><path d="M42 6Q55 20 68 6" fill="none" stroke="#0A4597" stroke-width="6"/><path d="M5 31L18 54L29 46M81 46L92 54L105 31" fill="none" stroke="#fff" stroke-width="5"/><text x="55" y="81" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="${n.length>2?36:49}" font-weight="800">${escapeHTML(n)}</text></svg>`}
function identity(p,large=false){return `<div class="player-identity">${jersey(p?.number,large)}<div><b>${escapeHTML(p?.name||'Vælg spiller')}</b><div class="muted small">${escapeHTML(team()?.name||'')} · ${p?.number!=null?'#'+escapeHTML(p.number):'Nummer ikke angivet'}</div>${p?.goal?`<div class="profile-note">${escapeHTML(p.goal)}</div>`:''}</div></div>`}
function eventTasks(e){if(e.type==='team')return (e.blocks||[]).map((b,i)=>({id:String(b.id??i),name:b.name||b.title||'Træningsblok',description:b.description||b.notes||''}));const prog=db.programs.find(p=>String(p.id)===String(e.programId));return (e.exercises||prog?.exercises||[]).map((x,i)=>({id:String(x.id??i),name:x.name||'Øvelse',description:[x.prescription,x.notes].filter(Boolean).join(' · ')}))}
function eventCard(e){const tasks=eventTasks(e),open=expandedEvent===String(e.id),isIndividual=e.type==='individual';return `<div class="card"><div class="row"><div><span class="chip">${isIndividual?'Individuel':'Holdtræning'}</span><h2 style="margin:9px 0 4px">${escapeHTML(e.title||'Træning')}</h2><div class="small muted">${escapeHTML([e.start&&e.start+'–'+(e.end||''),e.theme].filter(Boolean).join(' · '))}</div></div><button class="btn tiny sub" onclick="toggleEvent('${escapeHTML(e.id)}')">${open?'Luk':'Vis øvelser'}</button></div>${open?`<div class="line"></div>${isIndividual?`<p class="note"><b>Registrér dine øvelser nedenfor:</b> Vælg Gennemført, Delvist eller Ikke udført. Valget gemmes automatisk.</p>`:''}${tasks.length?tasks.map(t=>{const state=completed(e.id,t.id)?.status||'pending';return `<div class="item"><div class="row"><div><b>${escapeHTML(t.name)}</b><div class="muted small" style="margin-top:4px">${escapeHTML(t.description)}</div></div>${isIndividual?`<span class="chip">${state==='done'?'✓':state==='partial'?'½':state==='skipped'?'–':'○'}</span>`:''}</div>${isIndividual?`<div class="tabs" style="padding-top:10px"><button class="btn tiny ${state==='done'?'':'ghost'}" onclick="setTask('${escapeHTML(e.id)}','${escapeHTML(t.id)}','done')">Gennemført</button><button class="btn tiny ${state==='partial'?'':'ghost'}" onclick="setTask('${escapeHTML(e.id)}','${escapeHTML(t.id)}','partial')">Delvist</button><button class="btn tiny ${state==='skipped'?'':'ghost'}" onclick="setTask('${escapeHTML(e.id)}','${escapeHTML(t.id)}','skipped')">Ikke udført</button></div>`:'<div class="muted tiny" style="margin-top:8px">Holdtræning: gennemførelse registreres af træneren.</div>'}</div>`}).join(''):'<div class="empty">Ingen øvelser tilknyttet endnu.</div>'}<p class="note">Programmet er skrivebeskyttet. ${isIndividual?'Du kan kun registrere gennemførelsen.':'Check-in er ikke det samme som fremmøde.'}</p>`:''}</div>`}
function toggleEvent(x){expandedEvent=expandedEvent===x?null:x;render()}function setTask(eventId,taskId,status){const a=db.taskCompletions;const i=a.findIndex(x=>String(x.playerId)===String(player().id)&&String(x.eventId)===eventId&&String(x.taskId)===taskId);const record={playerId:player().id,eventId,taskId,status,updatedAt:new Date().toISOString()};if(i>=0)a[i]=record;else a.push(record);save();render()}
function checkinForm(d){const v=checkinOn(d);const training=eventsOn(d).some(e=>e.type==='team');if(!training)return `<div class="card"><h2 class="h2">Check-in</h2><p class="muted">Ingen holdtræning planlagt denne dag. Check-in er kun aktiv på træningsdage.</p></div>`;return `<div class="card"><div class="row"><h2 class="h2">Check-in før træning</h2><span class="chip">${v?'✓ Registreret':'Afventer'}</span></div><form id="checkinForm" onsubmit="submitCheckin(event,'${d}')"><div class="two"><div class="field"><label>Parathed (1–10)</label><select name="readiness" required>${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${Number(v?.readiness||7)===i+1?'selected':''}>${i+1}</option>`).join('')}</select></div><div class="field"><label>Søvn i timer (0–16)</label><input name="sleep" type="number" min="0" max="16" step="0.5" required value="${escapeHTML(v?.sleepHours??8)}"></div></div><div class="field"><label>Muskelømhed (0–10)</label><select name="soreness">${Array.from({length:11},(_,i)=>`<option value="${i}" ${Number(v?.soreness??3)===i?'selected':''}>${i}</option>`).join('')}</select></div><div class="field"><label>Kommentar om smerter/skader (valgfri)</label><textarea name="comment" maxlength="800" placeholder="Hvor gør det ondt? Er der noget, træneren skal vide?">${escapeHTML(v?.comment||'')}</textarea></div><button class="btn full" type="submit">${v?'Opdatér check-in':'Registrér check-in'}</button>${v?`<p class="note">Sidst registreret: ${new Date(v.updatedAt).toLocaleString('da-DK')}</p>`:''}</form></div>`}
function submitCheckin(ev,d){ev.preventDefault();const f=ev.target;const readiness=Number(f.readiness.value),sleepHours=Number(f.sleep.value),soreness=Number(f.soreness.value);if(!Number.isFinite(sleepHours)||sleepHours<0||sleepHours>16||readiness<1||readiness>10||soreness<0||soreness>10){alert('Kontrollér de indtastede værdier.');return}const a=db.checkins,i=a.findIndex(x=>x.date===d&&String(x.playerId)===String(player().id));const record={id:i>=0?a[i].id:id(),playerId:player().id,teamId:player().teamId,date:d,readiness,sleepHours,soreness,comment:f.comment.value.trim(),updatedAt:new Date().toISOString()};if(i>=0)a[i]=record;else a.push(record);save();toast='Check-in gemt lokalt';render()}
function home(){const es=eventsOn(today);return header('I dag',fmt(today))+`<div class="card soft"><div class="row">${identity(player(),true)}<span class="chip">Demo</span></div></div>${toast?`<p class="ok">${escapeHTML(toast)}</p>`:''}${checkinForm(today)}<h2 class="h2" style="margin-top:22px">Dagens træning</h2>${es.length?es.map(eventCard).join(''):'<div class="empty">Ingen opgaver planlagt i dag.</div>'}<div class="row" style="margin-top:20px"><h2 class="h2">Beskeder</h2>${btn('Åbn beskeder',"go('messages')",'tiny sub')}</div>${(db.messages||[]).filter(m=>m.scope==='team'&&String(m.teamId)===String(player()?.teamId)||m.scope==='private'&&String(m.playerId)===String(player()?.id)).slice(-2).reverse().map(m=>`<div class="card"><div class="small muted">${escapeHTML(m.senderName||m.senderRole)}</div><p>${escapeHTML(m.text)}</p></div>`).join('')||'<div class="empty">Ingen beskeder.</div>'}`}
function calendar(){const days=Array.from({length:15},(_,i)=>addDays(today,i-3));return header('Kalender','Holdtræning og individuelle opgaver')+`<div class="day">${days.map(d=>`<button class="${d===selectedDate?'active':''}" onclick="chooseDate('${d}')"><div class="tiny">${new Date(d+'T12:00:00').toLocaleDateString('da-DK',{weekday:'short'})}</div><b>${new Date(d+'T12:00:00').getDate()}</b>${eventsOn(d).length?'<div class="dot" style="margin:auto"></div>':''}</button>`).join('')}</div><div class="row"><h2 class="h2">${fmt(selectedDate)}</h2><button class="btn tiny ghost" onclick="chooseDate('${today}')">I dag</button></div>${eventsOn(selectedDate).length?eventsOn(selectedDate).map(eventCard).join(''):'<div class="empty">Ingen aktiviteter denne dag.</div>'}${checkinOn(selectedDate)?`<p class="note">✓ Check-in registreret denne dag.</p>`:''}`}
function chooseDate(d){selectedDate=d;expandedEvent=null;render()}
function dataPage(){const perf=(db.performance||[]).find(x=>String(x.playerId)===String(player()?.id));const checkins=db.checkins.filter(x=>String(x.playerId)===String(player()?.id));const completions=db.taskCompletions.filter(x=>String(x.playerId)===String(player()?.id));return header('Mine data','Skrivebeskyttet performanceoverblik')+`<div class="card"><div class="row"><div>${identity(player(),true)}</div><span class="chip">Kun visning</span></div><div class="line"></div><b>Udviklingsmål</b><p class="muted">${escapeHTML(player()?.goal||'Ikke angivet')}</p></div><div class="two"><div class="card"><div class="muted small">Check-ins</div><h1>${checkins.length}</h1></div><div class="card"><div class="muted small">Opgaver registreret</div><h1>${completions.length}</h1></div></div><div class="card"><h2 class="h2">Testresultater</h2>${(perf?.tests||[]).length?perf.tests.map(t=>`<div class="item row"><div><b>${escapeHTML(t.name)}</b><div class="muted tiny">${escapeHTML(t.date||'')}</div></div><b>${escapeHTML(t.value)}</b></div>`).join(''):'<p class="muted">Ingen testresultater importeret.</p>'}</div><div class="card"><h2 class="h2">GPS / Load</h2>${(perf?.gps||[]).length?perf.gps.map(t=>`<div class="item row"><div><b>${escapeHTML(t.name)}</b><div class="muted tiny">${escapeHTML(t.date||'')}</div></div><b>${escapeHTML(t.value)}</b></div>`).join(''):'<p class="muted">Ingen GPS-data importeret.</p>'}</div><div class="card"><h2 class="h2">PHV / Modning</h2><p>${escapeHTML(perf?.phv?.status||'Ingen data')}</p><div class="muted small">${escapeHTML(perf?.phv?.value||'')}</div></div><p class="note">Data vises som modtaget i prototypen. Kontrollér kilde og dato før sportsfaglig anvendelse.</p>`}
function messages(){const ms=(db.messages||[]).filter(m=>conversation==='team'?m.scope==='team'&&String(m.teamId)===String(player()?.teamId):m.scope==='private'&&String(m.playerId)===String(player()?.id));return header('Beskeder','Private samtaler og holdbeskeder')+`<div class="tabs"><button class="btn tiny ${conversation==='team'?'':'ghost'}" onclick="setConversation('team')">Holdbeskeder</button><button class="btn tiny ${conversation==='private'?'':'ghost'}" onclick="setConversation('private')">Privat med træner</button></div><div class="card"><h2 class="h2">${conversation==='team'?'Hold · '+escapeHTML(team()?.name||''):'Træner · Privat'}</h2>${ms.length?ms.map(m=>`<div class="bubble ${m.senderRole==='player'?'mine':''}"><div class="tiny muted" style="margin-bottom:5px">${escapeHTML(m.senderName||m.senderRole)} · ${new Date(m.createdAt).toLocaleString('da-DK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>${escapeHTML(m.text)}</div>`).join(''):'<div class="empty">Ingen beskeder endnu.</div>'}<form onsubmit="sendMessage(event)"><div class="field"><label>${conversation==='team'?'Skriv til holdet (demo)':'Skriv privat til træneren (demo)'}</label><textarea name="message" required maxlength="1000" placeholder="Skriv besked..."></textarea></div><button class="btn full" type="submit">Send besked lokalt</button></form><p class="note">Beskeder gemmes kun i denne browser. Ingen andre modtager dem, før en fælles backend er etableret.</p></div>`}
function setConversation(c){conversation=c;render()}function sendMessage(ev){ev.preventDefault();const value=ev.target.message.value.trim();if(!value)return;db.messages.push({id:id(),scope:conversation,teamId:player().teamId,playerId:conversation==='private'?player().id:null,senderRole:'player',senderName:player().name,text:value,createdAt:new Date().toISOString()});save();render()}
function settings(){return header('Mere','Spillerprofil og indstillinger')+`<div class="card"><h2 class="h2">Aktiv spiller</h2><div class="field"><label>Skift demoprofil</label><select onchange="switchPlayer(this.value)">${db.players.map(p=>`<option value="${escapeHTML(p.id)}" ${String(p.id)===String(player()?.id)?'selected':''}>${escapeHTML(p.name)} · ${escapeHTML(db.teams.find(t=>String(t.id)===String(p.teamId))?.name||'')}</option>`).join('')}</select></div><p class="note">Profilskift er kun til demonstration. Den endelige løsning kræver sikker login og serverbaseret adgangskontrol.</p></div>${playerBridgeUI()}<details class="card dev-tools"><summary>Udviklerværktøjer · kun testversion</summary><h2 class="h2">JSON-backup og gendannelse</h2><p class="muted small">Eksporten følger <code>elastico-shared-v1</code> og kan læses af en kommende Coach-version, når vi implementerer den tilsvarende import.</p><div class="stack"><button class="btn full" onclick="exportData()">Eksportér Player-data (JSON)</button><button class="btn sub full" onclick="el('importFile').click()">Importér Elastico JSON</button></div><p class="note">Import erstatter eksisterende lokale data. Eksportér altid først en backup. Disse værktøjer fjernes helt fra spillerrollen, når login og adgangsstyring etableres.</p></details><div class="card"><h2 class="h2">Demo og privatliv</h2><p class="note">Alle oplysninger ligger lokalt på denne enhed. Undlad at indtaste rigtige helbredsoplysninger i den offentligt hostede prototype. Den har ingen sikker brugeridentifikation eller synkronisering.</p><button class="btn tiny ghost" onclick="resetDemo()">Nulstil til demodata</button></div>`}
function switchPlayer(x){db.activePlayerId=x;save();go('home')}function exportData(){const out={...db,exportedAt:new Date().toISOString(),source:'elastico-player-0.1.3'};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='elastico-player-data-'+today+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}function resetDemo(){if(confirm('Slet alle lokale ændringer og gendan demodata?')){db=seed();save();go('home')}}
function normalizeImport(obj){if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error('JSON skal indeholde et dataobjekt.');const raw=obj.data&&typeof obj.data==='object'?obj.data:obj;if(!Array.isArray(raw.players)||!Array.isArray(raw.teams))throw Error('Filen skal indeholde arrays med players og teams.');if(raw.players.length>10000||raw.teams.length>1000)throw Error('Datasættet er for stort.');const base=seed();const x={...base,...raw,schema:'elastico-shared-v1',version:1};for(const k of ['players','teams','programs','calendarEvents','checkins','taskCompletions','attendance','messages','performance'])x[k]=Array.isArray(raw[k])?raw[k]:base[k]&&['players','teams','programs'].includes(k)?base[k]:[];x.players=x.players.map(p=>({...p,id:p.id,teamId:p.teamId??x.teams.find(t=>t.name===p.team)?.id}));x.calendarEvents=x.calendarEvents.filter(e=>typeof e.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date));x.activePlayerId=x.players.some(p=>String(p.id)===String(raw.activePlayerId))?raw.activePlayerId:x.players[0]?.id;return x}
el('importFile').addEventListener('change',async ev=>{const f=ev.target.files?.[0];if(!f)return;try{if(f.size>4e6)throw Error('Filen må højst fylde 4 MB.');const raw=JSON.parse(await f.text());const imported=normalizeImport(raw);if(!confirm(`ADVARSEL: Import overskriver ALLE lokale data på denne telefon, herunder check-ins, beskeder og opgavestatus.\n\nNy fil: ${imported.players.length} spillere, ${imported.teams.length} hold og ${imported.calendarEvents.length} kalenderaktiviteter.\n\nHar du gemt din JSON-backup i Arkiver?\n\nTryk OK for at overskrive.`))return;const previous=db;db=imported;if(!save()){db=previous;return}toast='Import gennemført';go('home')}catch(e){alert('Import mislykkedes: '+e.message)}finally{ev.target.value=''}});
function render(){nav();const content={home,calendar,data:dataPage,messages,settings};el('app').innerHTML=(content[page]||home)()};render();

/* ELASTICO BRIDGE 0.1.3 — additive import; preserves all local Player activity. */
function playerBridgeUI(){const tasks=(db.calendarEvents||[]).filter(e=>String(e.id).startsWith('coach-')&&e.playerId===player()?.id);return `<div class="card"><h2 class="h2">Træner → Spiller · demo</h2><p class="note">Importér opgaver fra Mobile Coach 0.2. Dine check-ins, gennemførelser, beskeder og testresultater bevares.</p><input id="coachBridgeFile" type="file" accept=".json,application/json" onchange="playerImportCoach(this.files[0])" style="max-width:100%"><p class="muted small">Importerede træningsopgaver: ${tasks.length}</p><button class="btn full" onclick="playerExportFeedback()" ${tasks.length?'':'disabled'}>Eksportér svar til træner (JSON)</button></div>`}
async function playerImportCoach(file){if(!file)return;try{if(file.size>1024*1024)throw Error('Filen er for stor');const x=JSON.parse(await file.text());if(x.format!=='elastico-coach-player-bridge-v1'||x.direction!=='coach-to-player'||!Array.isArray(x.tasks))throw Error('Ikke en gyldig Mobile Coach-fil');if(x.tasks.length>100)throw Error('For mange opgaver');const p=db.players.find(v=>String(v.name||'').trim().toLowerCase()==='lucas hessel');if(!p)throw Error('Lucas Hessel findes ikke i Player');let count=0;for(const t of x.tasks){if(t.playerName!=='Lucas Hessel'||t.team!=='U19'||typeof t.id!=='string'||!/^coach-[a-zA-Z0-9-]+$/.test(t.id)||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(t.date)||!Array.isArray(t.exercises)||!t.exercises.length||t.exercises.length>30)continue;if(db.calendarEvents.some(e=>e.id===t.id))continue;const exercises=t.exercises.map((e,i)=>({id:t.id+'-ex'+i,name:String(e.name||'Øvelse').slice(0,100),prescription:String(e.prescription||'').slice(0,200)}));db.calendarEvents.push({id:t.id,date:t.date,teamId:p.teamId,playerId:p.id,type:'individual',title:String(t.title||'Træningsopgave').slice(0,100),exercises,source:'elastico-mobile-coach-0.2'});count++}if(count)save();render();alert(count+' nye opgaver importeret. Eksisterende registreringer er bevaret.')}catch(e){alert('Importfejl: '+e.message)}}
function playerExportFeedback(){const p=db.players.find(v=>String(v.name||'').trim().toLowerCase()==='lucas hessel');if(!p){alert('Lucas Hessel blev ikke fundet');return}const tasks=(db.calendarEvents||[]).filter(e=>String(e.id).startsWith('coach-')&&e.playerId===p.id);const feedback=tasks.map(t=>({taskId:t.id,title:t.title,date:t.date,completions:(t.exercises||[]).map(ex=>({name:ex.name,status:(db.taskCompletions||[]).find(c=>String(c.playerId)===String(p.id)&&String(c.eventId)===String(t.id)&&String(c.taskId)===String(ex.id))?.status||'pending'}))}));const payload={format:'elastico-coach-player-bridge-v1',direction:'player-to-coach',exportedAt:new Date().toISOString(),playerName:'Lucas Hessel',feedback};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='elastico-player-svar-'+today+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
</script></body></html>
